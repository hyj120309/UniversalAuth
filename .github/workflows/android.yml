name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clone xposedutil
      run: git clone https://github.com/hyj120309/xposedutil.git xposedutil

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    # 1. 安全解密：通过环境变量将 Base64 写入文件并解码，避免 Shell 参数截断
    - name: Decode Keystore
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      run: |
        echo "$SIGNING_KEY" | base64 -d > release.keystore

    # 2. 安全签名：通过管道传参给 apksigner，防止密码暴露在进程参数列表(ps)中
    - name: Sign APK
      env:
        ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        # 寻找系统的 apksigner
        APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
        echo "Using apksigner at: $APKSIGNER"

        # 打印当前所有生成的 apk，便于排查
        echo "=== 找到的原始 APK 文件 ==="
        find . -type f -name "*.apk"

        # 遍历签名
        SIGNED_COUNT=0
        for apk in $(find . -type f -path "*/outputs/apk/release/*.apk" ! -name "*-signed.apk"); do
          echo "Signing $apk ..."
          
          # 执行签名
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEY_PASS \
            --out "${apk%.apk}-signed.apk" \
            "$apk"
          
          # 验证签名结果
          if [ $? -eq 0 ]; then
            echo "✅ 成功生成: ${apk%.apk}-signed.apk"
            SIGNED_COUNT=$((SIGNED_COUNT+1))
          else
            echo "❌ 签名失败: $apk"
            exit 1
          fi
        done

        if [ $SIGNED_COUNT -eq 0 ]; then
          echo "❌ 未找到可签名的 Release APK！"
          exit 1
        fi

    # 收集并上传所有已签名的 APK
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: signed-apk
        path: '**/*-signed.apk'
